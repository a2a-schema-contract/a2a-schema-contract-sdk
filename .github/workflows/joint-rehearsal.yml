name: Joint package rehearsal
on:
  push:
    branches: ["codex/python-sdk"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.1"
      - run: npm ci --ignore-scripts
        working-directory: js
      - run: npm run release:rehearsal
        working-directory: js
      - run: uv sync --locked --all-extras
        working-directory: python
      - run: uv run python scripts/release_rehearsal.py --revision "$GITHUB_SHA"
        working-directory: python
      - run: node scripts/joint-rehearsal.mjs
        working-directory: js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: joint-package-rehearsal
          path: |
            js/artifacts/
            js/reports/release-node24.json
            python/reports/release-rehearsal.json
            python/reports/joint-rehearsal.json
          if-no-files-found: error
